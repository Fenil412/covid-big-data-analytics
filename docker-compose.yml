version: "3.8"

networks:
  hadoop_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ─────────────────────────────────────────
  # Hadoop Master Node
  # ─────────────────────────────────────────
  master:
    image: apache/hadoop:3.3.6
    container_name: hadoop-master
    hostname: master
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_NAMENODE_USER=root
      - HDFS_DATANODE_USER=root
      - HDFS_SECONDARYNAMENODE_USER=root
      - YARN_RESOURCEMANAGER_USER=root
      - YARN_NODEMANAGER_USER=root
    ports:
      - "9870:9870"   # HDFS Web UI
      - "8088:8088"   # YARN Resource Manager
      - "7077:7077"   # Spark Master
      - "8080:8080"   # Spark Web UI
      - "4040:4040"   # Spark Application UI
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/utils:/opt/spark/utils
      - ./dataset:/data/raw
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.10
    command: ["sh", "-c", "/opt/hadoop/sbin/start-dfs.sh && /opt/hadoop/sbin/start-yarn.sh && tail -f /dev/null"]

  # ─────────────────────────────────────────
  # Worker Node 1
  # ─────────────────────────────────────────
  worker1:
    image: apache/hadoop:3.3.6
    container_name: hadoop-worker1
    hostname: worker1
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_DATANODE_USER=root
      - YARN_NODEMANAGER_USER=root
    depends_on:
      - master
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - hadoop_datanode1:/hadoop/dfs/data
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.11
    command: ["sh", "-c", "hdfs datanode & yarn nodemanager & tail -f /dev/null"]

  # ─────────────────────────────────────────
  # Worker Node 2
  # ─────────────────────────────────────────
  worker2:
    image: apache/hadoop:3.3.6
    container_name: hadoop-worker2
    hostname: worker2
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_DATANODE_USER=root
      - YARN_NODEMANAGER_USER=root
    depends_on:
      - master
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - hadoop_datanode2:/hadoop/dfs/data
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.12
    command: ["sh", "-c", "hdfs datanode & yarn nodemanager & tail -f /dev/null"]

  # ─────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: covid-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=covid_analytics
    volumes:
      - ./config/mongodb/mongod.conf:/etc/mongod.conf
      - mongo_data:/data/db
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.20

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  mongo_data:
