# =============================================================================
# docker-compose.yml — 3-Node Hadoop Cluster
# Project: COVID-19 Big Data Analytics Platform
# Author:  Fenil Chodvadiya (Member 1 — Lead Data Engineer)
#
# NOTE: MongoDB is hosted on MongoDB Atlas (cloud).
#       No local MongoDB container is needed.
#       Set MONGODB_ATLAS_URI in your .env file before running.
# =============================================================================

networks:
  hadoop_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ─────────────────────────────────────────
  # Hadoop Master Node (NameNode + YARN ResourceManager + Spark Master)
  # ─────────────────────────────────────────
  master:
    image: apache/hadoop:3.3.6
    container_name: hadoop-master
    hostname: master
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_NAMENODE_USER=root
      - HDFS_DATANODE_USER=root
      - HDFS_SECONDARYNAMENODE_USER=root
      - YARN_RESOURCEMANAGER_USER=root
      - YARN_NODEMANAGER_USER=root
      # Pass Atlas URI from host .env into container
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-covid_analytics}
    ports:
      - "9870:9870"   # HDFS Web UI
      - "8088:8088"   # YARN Resource Manager
      - "7077:7077"   # Spark Master
      - "8080:8080"   # Spark Web UI
      - "4040:4040"   # Spark Application UI
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./config/spark:/opt/spark/conf
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/utils:/opt/spark/utils
      - ./src:/opt/spark/src
      - ./dataset:/data/raw
      - ./.env:/opt/spark/.env:ro
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.10
    command: ["sh", "-c", "/opt/hadoop/sbin/start-dfs.sh && /opt/hadoop/sbin/start-yarn.sh && tail -f /dev/null"]

  # ─────────────────────────────────────────
  # Worker Node 1
  # ─────────────────────────────────────────
  worker1:
    image: apache/hadoop:3.3.6
    container_name: hadoop-worker1
    hostname: worker1
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_DATANODE_USER=root
      - YARN_NODEMANAGER_USER=root
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
    depends_on:
      - master
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./.env:/opt/spark/.env:ro
      - hadoop_datanode1:/hadoop/dfs/data
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.11
    command: ["sh", "-c", "hdfs datanode & yarn nodemanager & tail -f /dev/null"]

  # ─────────────────────────────────────────
  # Worker Node 2
  # ─────────────────────────────────────────
  worker2:
    image: apache/hadoop:3.3.6
    container_name: hadoop-worker2
    hostname: worker2
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HDFS_DATANODE_USER=root
      - YARN_NODEMANAGER_USER=root
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
    depends_on:
      - master
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop
      - ./.env:/opt/spark/.env:ro
      - hadoop_datanode2:/hadoop/dfs/data
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.12
    command: ["sh", "-c", "hdfs datanode & yarn nodemanager & tail -f /dev/null"]

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
