# =============================================================================
# spark-defaults.conf — Apache Spark Cluster Configuration
# Project: COVID-19 Big Data Analytics Platform
# Author:  Fenil Chodvadiya (Member 1 — Lead Data Engineer)
#
# NOTE: MongoDB Atlas URI is NOT stored here.
#       It is loaded at runtime from the MONGODB_ATLAS_URI environment variable.
#       See .env.example for setup instructions.
# =============================================================================

# Spark Master URL (standalone cluster on Docker)
spark.master                                    spark://master:7077

# Application name
spark.app.name                                  COVID-Big-Data-Analytics

# ── Driver ────────────────────────────────────────────────────────────────────
spark.driver.memory                             2g
spark.driver.cores                              2

# ── Executor ──────────────────────────────────────────────────────────────────
spark.executor.memory                           2g
spark.executor.cores                            2
spark.executor.instances                        2

# ── Serialization ─────────────────────────────────────────────────────────────
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# ── HDFS Integration ──────────────────────────────────────────────────────────
spark.hadoop.fs.defaultFS                       hdfs://master:9000

# ── Event Log ─────────────────────────────────────────────────────────────────
spark.eventLog.enabled                          true
spark.eventLog.dir                              hdfs://master:9000/spark-logs

# ── MongoDB Atlas (URI injected at runtime from MONGODB_ATLAS_URI env var) ────
# spark.mongodb.output.uri                      <set via environment variable>
spark.mongodb.output.connection.ssl.enabled              true
spark.mongodb.output.connection.ssl.invalidHostNameAllowed  false

# ── Dynamic Allocation ────────────────────────────────────────────────────────
spark.dynamicAllocation.enabled                 false

# ── UI ────────────────────────────────────────────────────────────────────────
spark.ui.port                                   4040
