# =============================================================================
# mongod.conf — MongoDB Server Configuration
# Project: COVID-19 Big Data Analytics Platform
# Author:  Fenil Chodvadiya (Member 1 — Lead Data Engineer)
# =============================================================================

# ── Storage ───────────────────────────────────────────────────────────────────
storage:
  dbPath: /data/db
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

# ── System Log ────────────────────────────────────────────────────────────────
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

# ── Network ───────────────────────────────────────────────────────────────────
net:
  port: 27017
  bindIp: 0.0.0.0    # Accept connections from all interfaces (Docker network)

# ── Process Management ────────────────────────────────────────────────────────
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# ── Security ──────────────────────────────────────────────────────────────────
security:
  authorization: disabled    # Disabled for development cluster
